  # --- Councils and public bodies via ArcGIS Hub ------------------------
  # These publish real datasets — deprivation indices, blue-badge parking,
  # flood management, listed buildings — through ArcGIS Online with no
  # catalogue of their own that we can find. Hub's federated search exposes
  # them per organisation.
  #
  # require_description is doing heavy lifting. An ArcGIS org shares
  # everything it ever made public: a 10-council pilot returned 12,874
  # records of which 28% had nothing at all and only 12% carried a
  # description — titles like "Family Hub Logo form" and "surveyPoint".
  # Keeping what the publisher bothered to describe cut it to 1,604 records,
  # all described, none thin.

  - id: agol_middlesbrough_council
    name: "Middlesbrough Council"                             # contain colons and ampersands
    type: json
    api: https://hub.arcgis.com/api/v3/datasets
    web: https://hub.arcgis.com
    dataset_url: "unused-for-json"
    json:
      list: data
      total: meta.total
      page_param: "page[number]"
      params: {"filter[orgId]": "3cR2auvUpZIsWeSM", "page[size]": 100}
      id: id
      title: attributes.name
      description: attributes.description
      license: attributes.license
      modified: attributes.modified
      landing: "https://hub.arcgis.com/datasets/{id}"
      resources:
        - [attributes.url, "=Esri REST"]
      require_description: 40
