  # --- Bespoke JSON catalogues -----------------------------------------
  # These speak no standard at all, so the shape lives here as config rather
  # than as three near-identical adapters. See harvest_json in harvester.py.
  - id: nbn_atlas
    name: NBN Atlas (UK biodiversity network)
    type: json
    api: https://registry.nbnatlas.org/ws/dataResource
    web: https://registry.nbnatlas.org
    dataset_url: "unused-for-json"
    json:
      list: ""                       # a bare list at the document root
      id: uid
      name: uid
      title: name
      created: dateCreated
      modified: lastUpdated
      # The listing carries no description, licence or download; all three
      # are one request away, and without them every record would be a title
      # and a link — thin enough that we'd noindex it anyway.
      detail: "https://registry.nbnatlas.org/ws/dataResource/{id}"
      description: pubDescription
      license: licenseType
      publisher: provider.name
      landing: "https://registry.nbnatlas.org/public/show/{id}"
      resources:
        - [publicArchiveUrl, ""]


  # Scotland's aggregator. Carries no `publisher` or `landingPage` at all,
  # but names 67 real organisations in contactPoint — councils, the Scottish
  # Parliament, Public Health Scotland — so the DCAT adapter now falls back
  # to that rather than filing 2,507 datasets under one invented publisher.
  - id: opendata_scot
    name: opendata.scot (Scottish open data)
    type: dcat
    api: https://opendata.scot/data.json
    web: https://opendata.scot
    dataset_url: "unused-for-dcat"

  # ArcGIS Hub's federated search, filtered to one organisation. Their data
  # has no catalogue of its own — the Hub site hostname is a vanity domain
  # that can't be derived — but the search API exposes it per org.
  - id: national_highways
    name: National Highways
    type: json
    api: https://hub.arcgis.com/api/v3/datasets
    web: https://www.nationalhighways.co.uk
    dataset_url: "unused-for-json"
    json:
      list: data
      total: meta.total
      page_param: "page[number]"
      params: {"filter[orgId]": "mZXeBXkkZpekxjXT", "page[size]": 100}
      id: id
      title: attributes.name
      description: attributes.description
      license: attributes.license
      modified: attributes.modified
      landing: "https://hub.arcgis.com/datasets/{id}"
      # The Hub record never states a format, but `url` is always an Esri
      # REST service — so say so rather than leave every record file-less.
      resources:
        - [attributes.url, "=Esri REST"]

  # Both found by mining our own resource URLs: we already link to these
