# UK Open Data Index — source registry
#
# This file is the "registry as code": every harvested portal is one entry here.
# To suggest a new source, open a PR adding an entry. CI validates the endpoint
# speaks CKAN and isn't a duplicate before a human merges.
#
# Fields:
#   id           stable slug used as the source key in the database
#   name         human-readable portal name
#   type         harvester protocol (currently only "ckan")
#   api          CKAN action API base (must expose {api}/package_search)
#   web          portal homepage
#   dataset_url  template for a dataset's landing page ({name} = CKAN slug)

sources:
  - id: data_gov_uk
    name: data.gov.uk (National Data Library)
    type: ckan
    api: https://data.gov.uk/api/action
    web: https://www.data.gov.uk
    dataset_url: https://www.data.gov.uk/dataset/{name}

  - id: london_datastore
    name: London Datastore (GLA)
