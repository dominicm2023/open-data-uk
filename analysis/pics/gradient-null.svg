<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 443" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The gradient that isn&#x27;t there"><title>The gradient that isn&#x27;t there</title><desc>analysis/strands/gradient_null/decile_series.csv — EDM 2025 x IMD 2019, spills per LSOA in each decile</desc><style>
text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.t-label { font-size: 14px; fill: #61656d; }
.t-value { font-size: 14px; fill: #16181c; font-weight: 600;
           font-variant-numeric: tabular-nums; }
.t-big   { font-size: 62px; fill: #0e6e63; font-weight: 700;
           font-variant-numeric: tabular-nums; }
.t-unit  { font-size: 15px; fill: #61656d; }
.p-key   { font-size: 9.5px; fill: #61656d; font-weight: 600;
           letter-spacing: .09em; }
.p-val   { font-size: 12px; fill: #16181c; }
.p-mono  { font-size: 11px; fill: #16181c;
           font-family: ui-monospace, Menlo, Consolas, monospace; }
</style><rect width="720" height="443" fill="#ffffff"/><defs><pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#a4192b"/><line x1="0" y="0" x2="0" y2="8" stroke="#ffffff" stroke-width="3" opacity=".55"/></pattern></defs><rect x="62.0" y="100.4" width="60.0" height="109.6" fill="#7a5c00"/><text x="93.5" y="226" class="t-label" text-anchor="middle">1</text><rect x="125.0" y="123.4" width="60.0" height="86.6" fill="#0e6e63"/><text x="156.5" y="226" class="t-label" text-anchor="middle">2</text><rect x="188.0" y="105.4" width="60.0" height="104.6" fill="#0e6e63"/><text x="219.5" y="226" class="t-label" text-anchor="middle">3</text><rect x="251.0" y="51.6" width="60.0" height="158.4" fill="#0e6e63"/><text x="282.5" y="226" class="t-label" text-anchor="middle">4</text><rect x="314.0" y="28.5" width="60.0" height="181.5" fill="#0e6e63"/><text x="345.5" y="226" class="t-label" text-anchor="middle">5</text><rect x="377.0" y="6.0" width="60.0" height="204.0" fill="#0e6e63"/><text x="408.5" y="226" class="t-label" text-anchor="middle">6</text><rect x="440.0" y="21.2" width="60.0" height="188.8" fill="#0e6e63"/><text x="471.5" y="226" class="t-label" text-anchor="middle">7</text><rect x="503.0" y="48.6" width="60.0" height="161.4" fill="#0e6e63"/><text x="534.5" y="226" class="t-label" text-anchor="middle">8</text><rect x="566.0" y="72.0" width="60.0" height="138.0" fill="#0e6e63"/><text x="597.5" y="226" class="t-label" text-anchor="middle">9</text><rect x="629.0" y="133.9" width="60.0" height="76.1" fill="#7a5c00"/><text x="660.5" y="226" class="t-label" text-anchor="middle">10</text><line x1="62" y1="210" x2="692" y2="210" stroke="#cfd0ca" stroke-width="1"/><text x="28" y="38" class="t-value">12.79</text><text x="28" y="252" class="t-label">Spills per neighbourhood by deprivation decile, England 2025 — decile 1 is most</text><text x="28" y="271" class="t-label">deprived, 10 least. The shape is an inverted U, not a slope: the middle of England</text><text x="28" y="290" class="t-label">gets the most sewage, and the poorest tenth sits near the richest. We went looking</text><text x="28" y="309" class="t-label">for the gradient everyone assumes. It is not there, and this chart is us saying so</text><text x="28" y="328" class="t-label">with the working attached.</text><rect x="0" y="353" width="720" height="90" fill="#e4f1ee"/><rect x="0" y="353" width="720" height="2" fill="#0e6e63"/><text x="28" y="377" class="p-key">MEASURED FROM</text><text x="28" y="393" class="p-mono">analysis/strands/gradient_null/decile_series.csv — EDM 2025 x IMD 2019, spills</text><text x="28" y="407" class="p-mono">per LSOA in each decile</text><text x="28" y="433" class="p-val">open-data.org.uk · measured 18 August 2026</text><text x="692" y="377" class="p-key" text-anchor="end">ARGUMENT BY</text><text x="692" y="394" class="p-val" text-anchor="end">Joined Up</text></svg>