<svg viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The receipt"><title>The receipt</title><desc>analysis/strands2/comedy/receipts.csv — one source file per line, amounts read from the rows, never retyped</desc><style>
text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.t-label { font-size: 14px; fill: #61656d; }
.t-value { font-size: 14px; fill: #16181c; font-weight: 600;
           font-variant-numeric: tabular-nums; }
.t-big   { font-size: 62px; fill: #0e6e63; font-weight: 700;
           font-variant-numeric: tabular-nums; }
.t-unit  { font-size: 15px; fill: #61656d; }
.p-key   { font-size: 9.5px; fill: #61656d; font-weight: 600;
           letter-spacing: .09em; }
.p-val   { font-size: 12px; fill: #16181c; }
.p-mono  { font-size: 11px; fill: #16181c;
           font-family: ui-monospace, Menlo, Consolas, monospace; }
</style><rect width="720" height="520" fill="#ffffff"/><defs><pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#a4192b"/><line x1="0" y="0" x2="0" y2="8" stroke="#ffffff" stroke-width="3" opacity=".55"/></pattern></defs><rect x="300" y="22" width="600" height="10" fill="#e4f1ee"/><text x="600.0" y="56" class="t-value" text-anchor="middle">THE PUBLIC LEDGER — SELECTED ITEMS</text><text x="600.0" y="76" class="p-key" text-anchor="middle">EVERY LINE VERBATIM FROM A PUBLISHED SPENDING FILE</text><text x="314" y="98" class="p-mono">PANTO EXPENDITURE — RUSHMOOR BC</text><text x="886" y="98" class="p-mono" text-anchor="end">£56,707.13</text><text x="314" y="116" class="p-key">3 LINES HELD OF A 508-PAYMENT LEDGER CODE</text><text x="314" y="136" class="p-mono">THE FLAG CONSULTANCY LTD — DCMS, &#x27;FLAG FLYING&#x27;</text><text x="886" y="136" class="p-mono" text-anchor="end">£56,500.00</text><text x="314" y="158" class="p-mono">TRUMP INTERNATIONAL GOLF — FCO CARD, AUG 2013</text><text x="886" y="158" class="p-mono" text-anchor="end">£4,545.00</text><text x="314" y="176" class="p-key">REFUNDED THE FOLLOWING MONTH</text><text x="314" y="196" class="p-mono">COLCHESTER OYSTER FISHERY — MOD, RENT AND RATES</text><text x="886" y="196" class="p-mono" text-anchor="end">£26,500.00</text><text x="314" y="214" class="p-key">TWICE YEARLY</text><text x="314" y="234" class="p-mono">KIRKBYMOORSIDE BELL RINGERS — N YORKS, &#x27;PUBLIC HEALTH&#x27;</text><text x="886" y="234" class="p-mono" text-anchor="end">£1,000.00</text><text x="314" y="256" class="p-mono">DARTS WORLD LTD — N YORKS, &#x27;PERFORMING ARTS&#x27;, 24 DEC</text><text x="886" y="256" class="p-mono" text-anchor="end">£28,814.05</text><text x="314" y="278" class="p-mono">JOSEPH`S AMAZING CAMELS — GREENWICH</text><text x="886" y="278" class="p-mono" text-anchor="end">£2,385.00</text><text x="314" y="300" class="p-mono">RUSS ERWYD T/AS CONWY JESTER — GREENWICH, PARKS</text><text x="886" y="300" class="p-mono" text-anchor="end">£1,950.00</text><text x="314" y="322" class="p-mono">LIFTING ARM FOR DOG DOUBLET — ENVIRONMENT AGENCY</text><text x="886" y="322" class="p-mono" text-anchor="end">£780.00</text><text x="314" y="344" class="p-mono">ORACLE — &#x27;SOFTWARE LICENCES&#x27;, 17 INVOICES</text><text x="886" y="344" class="p-mono" text-anchor="end">£0.23</text><line x1="314" y1="366" x2="886" y2="366" stroke="#cfd0ca" stroke-width="1" stroke-dasharray="4 4"/><text x="314" y="390" class="p-mono">TOTAL</text><text x="886" y="390" class="p-mono" text-anchor="end">A COUNTRY</text><text x="28" y="78" class="t-label">None of this is waste, exactly —</text><text x="28" y="97" class="t-label">Rushmoor runs a theatre, the</text><text x="28" y="116" class="t-label">sluice is really called the</text><text x="28" y="135" class="t-label">Dog-in-a-Doublet, and someone</text><text x="28" y="154" class="t-label">has to fly the flags. That is</text><text x="28" y="173" class="t-label">the point: the ledgers are full</text><text x="28" y="192" class="t-label">of true, checkable, gloriously</text><text x="28" y="211" class="t-label">specific life, and the same</text><text x="28" y="230" class="t-label">provenance that makes the jokes</text><text x="28" y="249" class="t-label">safe makes the serious claims</text><text x="28" y="268" class="t-label">stick.</text><rect x="0" y="430" width="720" height="90" fill="#e4f1ee"/><rect x="0" y="430" width="720" height="2" fill="#0e6e63"/><text x="28" y="454" class="p-key">MEASURED FROM</text><text x="28" y="470" class="p-mono">analysis/strands2/comedy/receipts.csv — one source file per line, amounts read</text><text x="28" y="484" class="p-mono">from the rows, never retyped</text><text x="28" y="510" class="p-val">open-data.org.uk · measured 19 August 2026</text><text x="692" y="454" class="p-key" text-anchor="end">ARGUMENT BY</text><text x="692" y="471" class="p-val" text-anchor="end">Joined Up</text></svg>