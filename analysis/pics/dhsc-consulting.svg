5" y="179.6" width="45.5" height="30.4" fill="#0e6e63"/><text x="667.8" y="226" class="t-label" text-anchor="middle">2022</text><line x1="62" y1="210" x2="692" y2="210" stroke="#cfd0ca" stroke-width="1"/><text x="28" y="38" class="t-value">204.60627838999997</text><text x="28" y="252" class="t-label">Consulting firms in the Department of Health&#x27;s published ledger, £m per financial</text><text x="28" y="271" class="t-label">year. £8.1m in 2019-20 became £204.6m in 2021-22 — nineteen times over, the</text><text x="28" y="290" class="t-label">Test-and-Trace era — before falling back. One Deloitte invoice alone was £44m, and</text><text x="28" y="309" class="t-label">£7.9m of Deloitte&#x27;s work was booked under a code the ledger calls Contractor/Staff</text><text x="28" y="328" class="t-label">Substitution: the austerity two-step, written in the state&#x27;s own vocabulary.</text><rect x="0" y="353" width="720" height="90" fill="#e4f1ee"/><rect x="0" y="353" width="720" height="2" fill="#0e6e63"/><text x="28" y="377" class="p-key">MEASURED FROM</text><text x="28" y="393" class="p-mono">analysis/strands2/consultants/dhsc_consulting_fy.csv — censused variants,</text><text x="28" y="407" class="p-mono">PwC&#x27;s routed fund money excluded before it lied</text><text x="28" y="433" class="p-val">open-data.org.uk · measured 19 August 2026</text><text x="692" y="377" class="p-key" text-anchor="end">ARGUMENT BY</text><text x="692" y="394" class="p-val" text-anchor="end">Joined Up</text></svg>