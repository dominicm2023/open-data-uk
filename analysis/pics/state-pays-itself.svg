<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="More than half of the spending in Britain&#x27;s transparency files is the state paying itself."><title>More than half of the spending in Britain&#x27;s transparency files is the state paying itself.</title><desc>The state paying itself, at headline scale</desc><style>
text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
.t-label { font-size: 14px; fill: #61656d; }
.t-value { font-size: 14px; fill: #16181c; font-weight: 600;
           font-variant-numeric: tabular-nums; }
.t-big   { font-size: 62px; fill: #0e6e63; font-weight: 700;
           font-variant-numeric: tabular-nums; }
.t-unit  { font-size: 15px; fill: #61656d; }
.p-key   { font-size: 9.5px; fill: #61656d; font-weight: 600;
           letter-spacing: .09em; }
.p-val   { font-size: 12px; fill: #16181c; }
.p-mono  { font-size: 11px; fill: #16181c;
           font-family: ui-monospace, Menlo, Consolas, monospace; }

.h-kicker { font-size: 15px; fill: #61656d; font-weight: 600;
            letter-spacing: .11em; }
