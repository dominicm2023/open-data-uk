</style><rect width="1200" height="630" fill="#ffffff"/><rect x="0" y="0" width="6" height="630" fill="#0e6e63"/><text x="56" y="86" class="h-kicker">WHERE THE MONEY ACTUALLY GOES</text><text x="56" y="124" class="h-title2">More than half of the</text><text x="56" y="162" class="h-title2">spending in Britain&#x27;s</text><text x="56" y="200" class="h-title2">transparency files is the</text><text x="56" y="238" class="h-title2">state paying itself.</text><text x="56" y="390" class="h-huge">£1.72tn</text><text x="769" y="344" class="h-unit">from public bodies to public</text><text x="769" y="372" class="h-unit">bodies</text><text x="56" y="452" class="h-sub">53% of the £3.27tn corpus: NHS block grants, pension transfers, department-to-Treasury flows. DHSC sends</text><text x="56" y="477" class="h-sub">91% of its published spend to other public bodies, and two of its single transfers each exceed the</text><text x="56" y="502" class="h-sub">combined 18-year spending of every council in the corpus. The transparency files exist to show us the</text><text x="56" y="527" class="h-sub">state&#x27;s suppliers; mostly they show the state&#x27;s plumbing.</text><rect x="0" y="538" width="1200" height="76" fill="#e4f1ee"/><rect x="0" y="538" width="1200" height="2" fill="#0e6e63"/><text x="28" y="562" class="p-key">MEASURED FROM</text><text x="28" y="578" class="p-mono">analysis/supplier/flows.csv — 9,523 publisher-to-body pairs, 4,919 public bodies, every name over £1M eyeballed</text><text x="28" y="604" class="p-val">open-data.org.uk · measured 17 August 2026</text><text x="1172" y="562" class="p-key" text-anchor="end">ARGUMENT BY</text><text x="1172" y="579" class="p-val" text-anchor="end">Joined Up</text></svg>