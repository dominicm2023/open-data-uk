"410" y="206.0" class="t-label">429</text><text x="410" y="221.0" class="t-value">265</text><text x="410" y="236.0" class="t-label">103</text><text x="410" y="251.0" class="t-label">67</text><text x="410" y="266.0" class="t-label">53</text><text x="410" y="281.0" class="t-label">43</text><text x="410" y="296.0" class="t-label">39</text><text x="410" y="311.0" class="t-label">36</text><text x="410" y="326.0" class="t-label">33</text><text x="410" y="341.0" class="t-label">30</text><text x="410" y="356.0" class="t-value">12</text><text x="28" y="370" class="t-label">England, real £ per resident by service. The lines that cross are the story:</text><text x="28" y="389" class="t-label">children&#x27;s social care up 50% and adult social care up 16% while libraries, culture</text><text x="28" y="408" class="t-label">and highways fell by around 40%. Austerity did not shrink the state evenly — it</text><text x="28" y="427" class="t-label">traded civic life for statutory care. Education is excluded here: academisation</text><text x="28" y="446" class="t-label">moved schools out of council accounts, and drawing it would be misread.</text><rect x="0" y="471" width="720" height="90" fill="#e4f1ee"/><rect x="0" y="471" width="720" height="2" fill="#0e6e63"/><text x="28" y="495" class="p-key">MEASURED FROM</text><text x="28" y="511" class="p-mono">analysis/strands/cuts_arc/arc_dumbbell.csv — England aggregate, real 2024-25</text><text x="28" y="525" class="p-mono">prices, education excluded (academisation caveat in findings.json)</text><text x="28" y="551" class="p-val">open-data.org.uk · measured 18 August 2026</text><text x="692" y="495" class="p-key" text-anchor="end">ARGUMENT BY</text><text x="692" y="512" class="p-val" text-anchor="end">Joined Up</text></svg>