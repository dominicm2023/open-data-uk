</style><rect width="720" height="595" fill="#ffffff"/><defs><pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#a4192b"/><line x1="0" y="0" x2="0" y2="8" stroke="#ffffff" stroke-width="3" opacity=".55"/></pattern></defs><text x="220" y="47" class="t-label" text-anchor="end">Plymouth</text><rect x="232" y="34" width="382" height="17" rx="3" fill="#0e6e63"/><text x="622" y="47" class="t-value">33,274.8</text><text x="220" y="77" class="t-label" text-anchor="end">Cumberland</text><rect x="232" y="64" width="244" height="17" rx="3" fill="#61656d"/><text x="484" y="77" class="t-value">21,276.1</text><text x="220" y="107" class="t-label" text-anchor="end">East Devon</text><rect x="232" y="94" width="189" height="17" rx="3" fill="#7a5c00"/><text x="429" y="107" class="t-value">16,507.5</text><text x="220" y="137" class="t-label" text-anchor="end">South Hams</text><rect x="232" y="124" width="188" height="17" rx="3" fill="#a4192b"/><text x="428" y="137" class="t-value">16,425.7</text><text x="220" y="167" class="t-label" text-anchor="end">South Tyneside</text><rect x="232" y="154" width="153" height="17" rx="3" fill="#0a6b45"/><text x="393" y="167" class="t-value">13,327.6</text><text x="220" y="197" class="t-label" text-anchor="end">Torbay</text><rect x="232" y="184" width="151" height="17" rx="3" fill="#0a6b45"/><text x="391" y="197" class="t-value">13,223.1</text><text x="220" y="227" class="t-label" text-anchor="end">North Tyneside</text><rect x="232" y="214" width="143" height="17" rx="3" fill="#0a6b45"/><text x="383" y="227" class="t-value">12,463.4</text><text x="220" y="257" class="t-label" text-anchor="end">Wirral</text><rect x="232" y="244" width="129" height="17" rx="3" fill="#0a6b45"/><text x="369" y="257" class="t-value">11,294.6</text><text x="220" y="287" class="t-label" text-anchor="end">Torridge</text><rect x="232" y="274" width="122" height="17" rx="3" fill="#0a6b45"/><text x="362" y="287" class="t-value">10,657.6</text><text x="220" y="317" class="t-label" text-anchor="end">Arun</text><rect x="232" y="304" width="88" height="17" rx="3" fill="#0a6b45"/><text x="328" y="317" class="t-value">7,688.7</text><text x="220" y="347" class="t-label" text-anchor="end">Lancaster</text><rect x="232" y="334" width="86" height="17" rx="3" fill="#0a6b45"/><text x="326" y="347" class="t-value">7,572.3</text><text x="220" y="377" class="t-label" text-anchor="end">Sefton</text><rect x="232" y="364" width="80" height="17" rx="3" fill="#0a6b45"/><text x="320" y="377" class="t-value">7,046.5</text><text x="28" y="404" class="t-label">Hours of monitored sewage discharge within 10km of the town centre, 2025, English</text><text x="28" y="423" class="t-label">seaside towns. Plymouth: 33,275 hours across 163 overflows. The method is crude and</text><text x="28" y="442" class="t-label">printed here: a 10km radius from the town centroid, which puts Birkenhead&#x27;s works in</text><text x="28" y="461" class="t-label">Sefton&#x27;s count across the estuary. England only — Wales and Scotland report under</text><text x="28" y="480" class="t-label">different regimes.</text><rect x="0" y="505" width="720" height="90" fill="#e4f1ee"/><rect x="0" y="505" width="720" height="2" fill="#0e6e63"/><text x="28" y="529" class="p-key">MEASURED FROM</text><text x="28" y="545" class="p-mono">analysis/strands/seaside/seaside_league.csv — EA EDM 2025 annual return, 10km</text><text x="28" y="559" class="p-mono">centroid radius, method stated</text><text x="28" y="585" class="p-val">open-data.org.uk · measured 18 August 2026</text><text x="692" y="529" class="p-key" text-anchor="end">ARGUMENT BY</text><text x="692" y="546" class="p-val" text-anchor="end">Joined Up</text></svg>