arillionAmey dies in October 2018 and Amey Defence Services (teal) appears</text><text x="28" y="309" class="t-label">the same month at £53.2m. Carillion the company was liquidated in January 2018 — its</text><text x="28" y="328" class="t-label">ledger tail is literally titled IN LIQUIDATION — and the money never paused. The</text><text x="28" y="347" class="t-label">firm collapsed; the flow was immortal.</text><rect x="0" y="372" width="720" height="90" fill="#e4f1ee"/><rect x="0" y="372" width="720" height="2" fill="#0e6e63"/><text x="28" y="396" class="p-key">MEASURED FROM</text><text x="28" y="412" class="p-mono">analysis/strands2/outsourcers/collapse_arcs_monthly.csv — monthly £ by</text><text x="28" y="426" class="p-mono">corporate vehicle, MoD-relay entities, 2010-2020</text><text x="28" y="452" class="p-val">open-data.org.uk · measured 19 August 2026</text><text x="692" y="396" class="p-key" text-anchor="end">ARGUMENT BY</text><text x="692" y="413" class="p-val" text-anchor="end">Joined Up</text></svg>