</style><rect width="720" height="371" fill="#ffffff"/><defs><pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#a4192b"/><line x1="0" y="0" x2="0" y2="8" stroke="#ffffff" stroke-width="3" opacity=".55"/></pattern></defs><text x="220" y="47" class="t-label" text-anchor="end">most deprived fifth</text><rect x="232" y="34" width="382" height="17" rx="3" fill="#0e6e63"/><text x="622" y="47" class="t-value">382.6752173913044</text><text x="220" y="77" class="t-label" text-anchor="end">second</text><rect x="232" y="64" width="332" height="17" rx="3" fill="#61656d"/><text x="572" y="77" class="t-value">333.1952380952381</text><text x="220" y="107" class="t-label" text-anchor="end">middle</text><rect x="232" y="94" width="315" height="17" rx="3" fill="#7a5c00"/><text x="555" y="107" class="t-value">315.7464</text><text x="220" y="137" class="t-label" text-anchor="end">fourth</text><rect x="232" y="124" width="250" height="17" rx="3" fill="#a4192b"/><text x="490" y="137" class="t-value">251.09217391304347</text><text x="220" y="167" class="t-label" text-anchor="end">least deprived fifth</text><rect x="232" y="154" width="222" height="17" rx="3" fill="#0a6b45"/><text x="462" y="167" class="t-value">223.31823529411764</text><text x="28" y="194" class="t-label">Mean real settlement lost per resident, 2013-14 to 2024-25, upper-tier councils</text><text x="28" y="213" class="t-label">quintiled by deprivation within their own class. The most deprived fifth lost</text><text x="28" y="232" class="t-label">roughly twice the pounds per resident of the least deprived fifth — and the same</text><text x="28" y="251" class="t-label">councils raise less from council tax, because poverty is also a weak tax base. The</text><text x="28" y="270" class="t-label">cut compounded.</text><rect x="0" y="295" width="720" height="76" fill="#e4f1ee"/><rect x="0" y="295" width="720" height="2" fill="#0e6e63"/><text x="28" y="319" class="p-key">MEASURED FROM</text><text x="28" y="335" class="p-mono">same file, quintiled by imd_rank_in_class within class, clean rows only</text><text x="28" y="361" class="p-val">open-data.org.uk · measured 19 August 2026</text><text x="692" y="319" class="p-key" text-anchor="end">ARGUMENT BY</text><text x="692" y="336" class="p-val" text-anchor="end">Joined Up</text></svg>