="t-label">66%</text><text x="410" y="238.6" class="t-label">51%</text><text x="410" y="253.6" class="t-label">50%</text><text x="28" y="370" class="t-label">Council tax as a share of net revenue expenditure. England moved from 47% to 63% in</text><text x="28" y="389" class="t-label">eleven years: as grant fell, the burden shifted from national taxation to the most</text><text x="28" y="408" class="t-label">regressive major tax in the system — the one that ignores what your house is</text><text x="28" y="427" class="t-label">actually worth and what you actually earn.</text><rect x="0" y="452" width="720" height="90" fill="#e4f1ee"/><rect x="0" y="452" width="720" height="2" fill="#0e6e63"/><text x="28" y="476" class="p-key">MEASURED FROM</text><text x="28" y="492" class="p-mono">analysis/strands/counciltax/ct_share_by_class.csv — council tax requirement</text><text x="28" y="506" class="p-mono">over NRE, per class</text><text x="28" y="532" class="p-val">open-data.org.uk · measured 18 August 2026</text><text x="692" y="476" class="p-key" text-anchor="end">ARGUMENT BY</text><text x="692" y="493" class="p-val" text-anchor="end">Joined Up</text></svg>