</style><rect width="720" height="535" fill="#ffffff"/><defs><pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#a4192b"/><line x1="0" y="0" x2="0" y2="8" stroke="#ffffff" stroke-width="3" opacity=".55"/></pattern></defs><text x="220" y="47" class="t-label" text-anchor="end">Marston — gross</text><rect x="232" y="34" width="382" height="17" rx="3" fill="#0e6e63"/><text x="622" y="47" class="t-value">11.98935035</text><text x="220" y="77" class="t-label" text-anchor="end">Marston — net</text><rect x="232" y="64" width="116" height="17" rx="3" fill="#61656d"/><text x="356" y="77" class="t-value">3.67042623</text><text x="220" y="107" class="t-label" text-anchor="end">Rossendales — gross</text><rect x="232" y="94" width="173" height="17" rx="3" fill="#7a5c00"/><text x="413" y="107" class="t-value">5.44701947</text><text x="220" y="137" class="t-label" text-anchor="end">Rossendales — net</text><rect x="232" y="124" width="170" height="17" rx="3" fill="#a4192b"/><text x="410" y="137" class="t-value">5.35330524</text><text x="220" y="167" class="t-label" text-anchor="end">Equita — gross</text><rect x="232" y="154" width="47" height="17" rx="3" fill="#0a6b45"/><text x="287" y="167" class="t-value">1.4997003500000001</text><text x="220" y="197" class="t-label" text-anchor="end">Equita — net</text><rect x="232" y="184" width="43" height="17" rx="3" fill="#0a6b45"/><text x="283" y="197" class="t-value">1.35287127</text><text x="220" y="227" class="t-label" text-anchor="end">Bristow &amp; Sutor — gross</text><rect x="232" y="214" width="46" height="17" rx="3" fill="#0a6b45"/><text x="286" y="227" class="t-value">1.46914993</text><text x="220" y="257" class="t-label" text-anchor="end">Bristow &amp; Sutor — net</text><rect x="232" y="244" width="2" height="17" rx="3" fill="#0a6b45"/><text x="242" y="257" class="t-value">0.02626233</text><text x="220" y="287" class="t-label" text-anchor="end">Whyte &amp; Co — gross</text><rect x="232" y="274" width="20" height="17" rx="3" fill="#0a6b45"/><text x="260" y="287" class="t-value">0.62937301</text><text x="220" y="317" class="t-label" text-anchor="end">Whyte &amp; Co — net</text><rect x="232" y="304" width="9" height="17" rx="3" fill="#0a6b45"/><text x="249" y="317" class="t-value">0.29458939</text><text x="28" y="344" class="t-label">£m through enforcement firms in the ledgers we hold: the gross legs against what</text><text x="28" y="363" class="t-label">actually stayed spent. North Yorkshire&#x27;s bailiff lines net to £403.84 across</text><text x="28" y="382" class="t-label">£228,000 of gross churn, and Bristol&#x27;s residuals are the statutory £75 and £235 fees</text><text x="28" y="401" class="t-label">the 2014 regulations charge to the debtor. Councils barely pay for enforcement — the</text><text x="28" y="420" class="t-label">people being enforced against do. The machine runs on its own targets.</text><rect x="0" y="445" width="720" height="90" fill="#e4f1ee"/><rect x="0" y="445" width="720" height="2" fill="#0e6e63"/><text x="28" y="469" class="p-key">MEASURED FROM</text><text x="28" y="485" class="p-mono">analysis/strands2/bailiffs/firm_totals.csv — gross legs vs net after same-day</text><text x="28" y="499" class="p-mono">contra reversals, per firm</text><text x="28" y="525" class="p-val">open-data.org.uk · measured 19 August 2026</text><text x="692" y="469" class="p-key" text-anchor="end">ARGUMENT BY</text><text x="692" y="486" class="p-val" text-anchor="end">Joined Up</text></svg>