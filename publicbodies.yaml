    candidates: [cairngorms.opendata.arcgis.com, data.cairngorms.co.uk]

  - name: New Forest National Park
    sector: National parks
    candidates: [newforest.opendata.arcgis.com, data.newforestnpa.gov.uk]

  # --- Combined authorities and city regions ----------------------------
  - name: Greater London Authority
    sector: Combined authorities
    candidates: [data.london.gov.uk, apps.london.gov.uk]

  - name: Greater Manchester Combined Authority
    sector: Combined authorities
    candidates: [data.gmcameetings.co.uk, gmdatastore.opendata.arcgis.com,
                 mappinggm.opendata.arcgis.com]

  - name: West Midlands Combined Authority
    sector: Combined authorities
    candidates: [data.wmca.org.uk, wmca.opendata.arcgis.com]

  - name: Liverpool City Region
    sector: Combined authorities
    candidates: [data.liverpoolcityregion-ca.gov.uk, lcrca.opendata.arcgis.com]

  - name: West Yorkshire Combined Authority
    sector: Combined authorities
    candidates: [datashare.westyorks-ca.gov.uk, wyca.opendata.arcgis.com]

  - name: Transport for the North
    sector: Combined authorities
    candidates: [data.transportforthenorth.com, tfn.opendata.arcgis.com]
