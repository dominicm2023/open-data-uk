name: Validate sources

on:
  pull_request:
    paths:
      - "sources.yaml"
      - "scripts/validate_sources.py"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyyaml
      - run: python scripts/validate_sources.py
