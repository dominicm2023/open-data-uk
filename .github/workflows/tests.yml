name: Tests

# The rules that decide what search hides. They have no network or database
# dependency, so unlike the relevance suite (which needs a built index) they
# can run on every push.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # requests is imported by harvester.py, which the placeholder suite
      # exercises directly; nothing here makes a request.
      - run: pip install pyyaml requests
      - name: Duplicate-collapsing rules
        run: python scripts/dedupe_test.py
      - name: Page rendering and escaping
        run: python scripts/render_test.py
      - name: Licence normalisation
        run: python scripts/licence_test.py
      # A portal that serves its template instead of its data puts a dataset
      # called "{{name}}" into search results. Every harvester has to refuse
      # it, so every harvester is covered.
      - name: Unrendered portal templates
        run: python scripts/placeholder_test.py
      # SVG doesn't reflow, so text that doesn't fit is drawn over whatever is
      # beside it and the chart still renders and still validates. Only a
      # geometry check catches that, and the text comes from findings.json,
      # which changes every night.
      - name: Chart geometry
        run: python scripts/charts_test.py

  live:
    # The unit tests cover rendering with invented records; this covers real
    # data through the real stack. Manual only — it talks to production.
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl the live site and check what a search engine would see
        run: python scripts/site_check.py --sample 10
